name: Update PR Lifecycle Data

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-pr-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update_pr_data:
    name: Generate PR reports
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install report dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-report.txt -r requirements.txt

      - name: Accumulate PR data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python accumulate_pr_data.py

      - name: Render reports if the CSV changed
        id: render
        run: |
          changed_file=$(git diff --name-only HEAD -- pr_data.csv)
          if [[ -z "$changed_file" ]]; then
            echo "CSV unchanged, skipping publication."
            exit 0
          fi
          python plot_pr_delays.py
          python plot_pr_counts.py
          python generate_pr_links_table.py
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload generated reports
        id: upload
        if: steps.render.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-report-${{ github.run_attempt }}
          path: |
            pr_data.csv
            pr_delays.png
            pr_counts.png
            README.md
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish PR reports
    needs: update_pr_data
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.update_pr_data.outputs.artifact_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Push the generated report commit to the default branch.
    steps:
      - name: Checkout the commit used to generate the reports
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download this run's report archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.update_pr_data.outputs.artifact_id }}
          path: ${{ runner.temp }}/pr-report
          skip-decompress: true

      - name: Commit generated reports
        id: commit
        run: |
          archives=("$RUNNER_TEMP/pr-report/"*)
          [[ ${#archives[@]} -eq 1 && -f "${archives[0]}" ]]
          # Stream only the expected files into the checkout. Archive paths never select a destination.
          reports=(pr_data.csv pr_delays.png pr_counts.png README.md)
          for file in "${reports[@]}"; do
            unzip -p "${archives[0]}" "$file" > "$file"
          done
          git add -- "${reports[@]}"
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "xlsynth-github-actions@xlsynth.org"
          git commit -m "Automatic update: PR data and plot"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Push report commit
        if: steps.commit.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: git -c credential.helper='!gh auth git-credential' push origin "HEAD:$GITHUB_REF"
